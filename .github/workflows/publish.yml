name: Publish image

on:
  push:
    branches: [family-lineage]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-family-lineage
  cancel-in-progress: false

jobs:
  publish:
    name: Push image to GHCR
    runs-on: ubuntu-latest
    environment: ghcr
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase image repository
        id: image
        run: echo "repo=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/family-lineage" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.repo }}:latest
            ${{ steps.image.outputs.repo }}:${{ github.sha }}
