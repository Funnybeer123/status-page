name: Publish image

on:
  push:
    branches: [family-lineage]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-family-lineage
  cancel-in-progress: false

jobs:
  publish:
    name: Push image to GHCR
    runs-on: ubuntu-latest
    environment: ghcr
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/family-lineage:latest
            ghcr.io/${{ github.repository_owner }}/family-lineage:${{ github.sha }}
