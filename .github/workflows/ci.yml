name: Family Lineage CI

on:
  push:
    branches: [family-lineage]
  pull_request:
    branches: [family-lineage]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run test:unit

  test:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lineage
          POSTGRES_PASSWORD: lineage
          POSTGRES_DB: lineage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lineage -d lineage"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://lineage:lineage@localhost:5432/lineage?schema=public
      AUTH_SECRET: ci-family-lineage-secret-not-for-production
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      MEDIA_ROOT: /tmp/family-lineage-media
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install OCR and ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr ffmpeg
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run build
      - name: Start app
        run: |
          npm start &
          bash scripts/wait-for-app.sh
      - run: npm test

  image:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build application image
        run: docker build -t family-lineage:ci .
