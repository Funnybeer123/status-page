name: Status snapshot

# Scheduled runs only fire on the repository default branch.
# workflow_dispatch can be run from this branch. This workflow is not
# a PR check, so existing PR CI is unchanged.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe locked URLs and write static snapshot
        env:
          AZURE_DEVOPS_PAT: ""
          GITHUB_TOKEN: ""
          AzureAd__ClientSecret: ""
          AZURE_CLIENT_SECRET: ""
          AZURE_CLIENT_ID: ""
          AZURE_TENANT_ID: ""
          Azure__SubscriptionId: ""
          AZURE_SUBSCRIPTION_ID: ""
        run: bash scripts/export-static.sh

      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: status-static
          path: static

      - name: Check for Static Web Apps token
        id: swa
        env:
          AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -n "${AZURE_STATIC_WEB_APPS_API_TOKEN:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "AZURE_STATIC_WEB_APPS_API_TOKEN is not set; skipping Static Web Apps deploy."
          fi

      - name: Deploy snapshot to existing Static Web Apps
        if: steps.swa.outputs.present == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: static
          skip_app_build: true
          skip_api_build: true
